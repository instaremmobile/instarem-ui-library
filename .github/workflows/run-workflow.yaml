name: Build and Lint

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [main, develop]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Clean
        run: rm -rf package-lock.json node_modules

      - name: Install dependencies
        run: npm i

      - name: Run linting
        run: npm run lint

      - name: Run type-check
        run: npm run type-check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
